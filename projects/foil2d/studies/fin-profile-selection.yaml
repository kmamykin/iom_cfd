study: fin-profile-selection
project: foil2d
description: >
  Fin and rudder section and chord selection for an IOM, with the transition
  model (kOmegaSSTLM). Compare drag at equal side force, not at equal Cl
  (report/selection.png; the table in report/selection_compare.md and
  summary.md). Findings, assumptions and decisions per run are logged in
  projects/foil2d/findings/fin-profile-selection.md.
  Run 20261012-045433 (0006/0009/0012, 80/100 mm, Tu 0.1 and 1 %, coarse
  mesh) put the thickness optimum between 0006 and 0009. Run
  20261012-175146 (0006-0012, 80/90/100 mm, Tu 1 %, medium mesh) found
  0008/80 and 0009/80 tied within 0-3 % at the working-load side force (the
  force 0009/80 makes at 4 deg, 0.75 m/s and up); 0008/80 is 1-10 % better in
  light air and 6-9 % worse at the 6 deg force, where 0009/100 wins and
  0008/90 sits in between.
  This run checks the four finalists (0008/80, 0009/80, 0008/90, 0009/100)
  at Tu 0.1 %: run 1 found that the lowest-drag candidate can change with Tu
  (3-12 % penalties where it did), and the run 2 tie is smaller than that.
  Compare with run 20261012-175146 (Tu 1 %, same mesh and cases) in the
  findings log. 0.25 m/s is left out (open laminar separation, unvalidated).
  The fine-mesh check of the tie is a separate study (mesh-finalists).
  Speeds: 0.5 and 0.75 m/s light air; 1.0 m/s upwind in medium air (Fn
  0.32); 1.5 m/s above displacement hull speed; 2.5 m/s downwind surfing.
  Re = 35,000 to 220,000; below about 50,000 the method is unvalidated (the
  transition model was checked at Re 1e5 only). Tu 0.1 % converged worse in
  run 1 (46 of 180 not converged, 4 failed at 0.25-0.5 m/s, 6-8 deg). The
  figure and table show the whole fin (report.fin_span) with the induced
  drag of that span added: the same for every candidate at equal side
  force. Steady solutions: where the laminar bubble sheds the `unsteady`
  column is set.
report:
  fin_span: 0.36        # m below the hull (appendage3d default; the class draught limit sets it)
  induced_drag: true    # lifting-line estimate, hull as a reflection plane, e = 0.9
  compare_at: {foil: naca0009, chord: 0.08, aoa: [2, 4, 6]}   # side forces of the comparison table (as run 1)
highlights:   # the cases to look at closely (Cp/Cf in the report; ParaView montages; fields fetched only for these)
  - name: tie-at-working-load
    why: >
      Run 20261012-175146 (Tu 1 %): 0008/80 and 0009/80 within 0-3 % at the 4 deg force from 0.75 m/s up.
      At Tu 0.1 % does transition move differently on the two and break the tie? Compare with run 2's montage.
    where: {chord: 0.08, speed: 1.0, aoa: [4, 6]}
    compare: foil
    views: [separation, transition]
  - name: light-air
    why: >
      Run 20261012-175146 (Tu 1 %): 0008/80 has 2-8 % less drag than 0009/80 at the 2 and 4 deg forces
      at 0.5-0.75 m/s. Does the longer laminar run at Tu 0.1 % keep that?
    where: {chord: 0.08, speed: 0.5, aoa: [2, 4]}
    compare: foil
    views: [separation, transition]
  - name: chord-at-high-load
    why: >
      Run 20261012-175146 (Tu 1 %): at the 6 deg force 0008/80 is 6-9 % above 0009/80 and 0008/90 is
      1-5 % below it. Is it the leading-edge bubble, and does it hold at Tu 0.1 %?
    where: {foil: naca0008, speed: 1.0, aoa: 6}
    compare: chord
    views: [separation, transition]
defaults:
  turbulence: kOmegaSSTLM
  Tu: 0.1
  mesh: medium
zip:          # the four finalists (foil and chord varied together)
  foil:  [naca0008, naca0009, naca0008, naca0009]
  chord: [0.08,     0.08,     0.09,     0.10]
sweep:
  speed: [0.5, 0.75, 1.0, 1.5, 2.5]
  aoa: [0, 2, 4, 6, 8]
