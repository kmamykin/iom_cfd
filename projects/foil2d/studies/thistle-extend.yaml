study: thistle-extend
project: foil2d
description: >
  Second stage of the Thistle centreboard CFD (findings:
  projects/foil2d/findings/thistle-board.md; method:
  projects/foil2d/methodology-thistle.md): the 37 points of the full grid
  that thistle-screen leaves out, for the sections that survive it, so the
  two runs together give the full polars ranked by `boardrank cfd
  <screen results.csv> <extend results.csv>`. V_b = 2 and 4 kn upwind at
  0-6, 8 and 10 deg; 1, 3 and 5 kn at 3, 5 and 10 deg (the screen has the
  rest); 7.5, 10 and 12.5 kn downwind at 0-2 deg, and 15 kn at 1 deg, with
  speed V_n = V_b cos 10 deg (rake 10 deg, assumed). Same settings as
  thistle-screen (steady kOmegaSSTLM, Tu 0.1 and 1 %, max_iter 12000, the
  same mesh), so the points combine. **The foil list is all eight screen
  sections until the screen is ranked: trim it to the survivors before
  submitting** (37 points x 2 Tu = 74 cases per section).
report:
  fin_span: 1.24
  induced_drag: true
  compare_at: {foil: "file:naca0006-t0556.dat", chord: 0.4572, aoa: [1, 2, 4]}
defaults:
  chord: 0.4572
  temperature: 20
  turbulence: kOmegaSSTLM
  mesh: medium          # the same level as thistle-screen
  max_iter: 12000
sweep:
  foil:                 # trim to the survivors of thistle-screen; keep NACA 0006 (the baseline)
    - "file:naca0006-t0556.dat"
    - "file:sd8020-t0556.dat"
    - "file:ht35-t0556.dat"
    - "file:naca63-006-t0556.dat"
    - "file:naca64-006-t0556.dat"
    - "file:naca0006-64-t0556.dat"
    - "file:parallel-l30-t50-r05-a20.dat"
    - "file:plank-typical.dat"
  Tu: [0.1, 1.0]
zip:                    # V_n [m/s]: the full grid's points that thistle-screen doesn't run
  speed: [0.5066, 0.5066, 0.5066,
          1.0133, 1.0133, 1.0133, 1.0133, 1.0133, 1.0133, 1.0133, 1.0133, 1.0133,
          1.5199, 1.5199, 1.5199,
          2.0265, 2.0265, 2.0265, 2.0265, 2.0265, 2.0265, 2.0265, 2.0265, 2.0265,
          2.5331, 2.5331, 2.5331,
          3.7997, 3.7997, 3.7997, 5.0663, 5.0663, 5.0663, 6.3329, 6.3329, 6.3329, 7.5994]
  aoa:   [3, 5, 10,
          0, 1, 2, 3, 4, 5, 6, 8, 10,
          3, 5, 10,
          0, 1, 2, 3, 4, 5, 6, 8, 10,
          3, 5, 10,
          0, 1, 2, 0, 1, 2, 0, 1, 2, 1]
