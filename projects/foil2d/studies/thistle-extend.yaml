study: thistle-extend
project: foil2d
description: >
  Second stage of the Thistle centreboard CFD (findings:
  projects/foil2d/findings/thistle-board.md; method:
  projects/foil2d/methodology-thistle.md): the full 57-point grid at the
  calibrated turbulence intensity for the sections that survive
  thistle-screen. Redesigned 2026-10-24 (user's choice) after
  thistle-tu-calibration run 20261023-221604: kOmegaSSTLM reproduces NACA
  Report 824 at Re 3e6 with inlet Tu 0.3 % on NACA 0006 (within 6 %) and
  about 0.45 % on 64-006 (0.3 % is 10-22 % low, 0.6 % 3-19 % high), while
  the screen's 0.1 % is too laminar and its 1 % effectively fully
  turbulent. So the screen (Tu 0.1 and 1 %) only bounds the answer and
  rejects the sections that lose at both; the ranking is decided here, at
  Tu 0.3 and 0.6 %. V_b = 1-5 kn upwind at 0-6, 8 and 10 deg and 7.5, 10,
  12.5 and 15 kn downwind at 0-2 deg, speed V_n = V_b cos 10 deg (rake
  10 deg, assumed); fine mesh, conv_window 1000, max_iter 12000 as the
  screen. Near-stall cases run all 12000 iterations, about 9.2 h on one
  core: submit with --max-hours 14 (the default limit stopped 4 screen
  cases at 94 %). Sections (user, 2026-10-24, after thistle-screen run
  20261023-125405): NACA 0006 (baseline), NACA 63-006 and 64-006, the
  question the two Tu bounds left open (10-12 % behind upwind at Tu 0.1 %,
  level at 1 %, 10-11 % ahead downwind at 1 %); 57 points x 2 Tu x 3
  sections = 342 cases.
report:
  fin_span: 1.24
  induced_drag: true
  compare_at: {foil: "file:naca0006-t0556.dat", chord: 0.4572, aoa: [1, 2, 4]}
highlights:
  - name: laminar-run
    why: >
      3 kn, 0 and 2 deg at the calibrated Tu: how much laminar run is left on the 6-series against
      NACA 0006 (the model favours the 6-series by 10-20 % at low lift; findings 2026-10-24).
    where: {speed: 1.5199, aoa: [0, 2], foil: ["file:naca0006-t0556.dat", "file:naca63-006-t0556.dat",
                                               "file:naca64-006-t0556.dat"]}
    compare: Tu
    views: [transition, separation]
defaults:
  chord: 0.4572
  temperature: 20
  turbulence: kOmegaSSTLM
  mesh: fine            # thistle-mesh run 20261023-052134 (findings 2026-10-23)
  conv_window: 1000     # 500 let an xfine case stop at 1239 iterations, its transition still moving
  max_iter: 12000
sweep:
  foil:                 # the user's pick after thistle-screen run 20261023-125405 (2026-10-24)
    - "file:naca0006-t0556.dat"
    - "file:naca63-006-t0556.dat"
    - "file:naca64-006-t0556.dat"
  Tu: [0.3, 0.6]
zip:                    # V_n [m/s] for V_b 1, 2, 3, 4, 5 kn (0-6, 8, 10 deg) and 7.5, 10, 12.5, 15 kn (0-2 deg)
  speed: [0.5066, 0.5066, 0.5066, 0.5066, 0.5066, 0.5066, 0.5066, 0.5066, 0.5066,
          1.0133, 1.0133, 1.0133, 1.0133, 1.0133, 1.0133, 1.0133, 1.0133, 1.0133,
          1.5199, 1.5199, 1.5199, 1.5199, 1.5199, 1.5199, 1.5199, 1.5199, 1.5199,
          2.0265, 2.0265, 2.0265, 2.0265, 2.0265, 2.0265, 2.0265, 2.0265, 2.0265,
          2.5331, 2.5331, 2.5331, 2.5331, 2.5331, 2.5331, 2.5331, 2.5331, 2.5331,
          3.7997, 3.7997, 3.7997, 5.0663, 5.0663, 5.0663, 6.3329, 6.3329, 6.3329, 7.5994, 7.5994, 7.5994]
  aoa:   [0, 1, 2, 3, 4, 5, 6, 8, 10,
