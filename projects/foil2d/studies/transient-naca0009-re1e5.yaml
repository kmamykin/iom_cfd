study: transient-naca0009-re1e5
project: foil2d
description: >
  Time-accurate (pimpleFoam) runs where the steady solver does not settle
  (4 deg, laminar bubble shedding) plus 8 deg for comparison. Forces are
  averaged over the last 6 chord flow-throughs of 15.
reference: validation/naca0009_re1e5_princeton.csv
defaults:
  foil: naca0009
  chord: 0.08
  Re: 1.0e5
  Tu: 0.1
  turbulence: kOmegaSSTLM
  mesh: coarse
  solver: transient
sweep:
  aoa: [4, 8]
