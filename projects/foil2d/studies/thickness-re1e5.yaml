study: thickness-re1e5
project: foil2d
description: >
  NACA 0006 against the validated NACA 0009 at Re = 1e5 (8 cm chord, the IOM
  fin and rudder regime). Expected: less drag at small angles, but with the
  sharper leading edge the laminar bubble moves forward sooner and the section
  stalls earlier. No wind-tunnel data for NACA 0006 at this Re is in the repository;
  read the 0006 polar relative to the 0009 (see validation-naca0009-re1e5 for
  how the 0009 compares with Princeton). Steady solutions: near 4 deg the
  bubble sheds, see transient-naca0009-re1e5.
defaults:
  chord: 0.08
  Re: 1.0e5
  Tu: 0.1
  turbulence: kOmegaSSTLM
  mesh: coarse
sweep:
  foil: [naca0006, naca0009]
  aoa: [0, 2, 4, 6, 8]
