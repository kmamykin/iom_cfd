study: tu-sweep-naca0009-re1e5
project: foil2d
description: >
  Sensitivity of the transition model to freestream turbulence intensity:
  NACA 0009, Re = 1e5, coarse mesh. Pond turbulence is unknown, so this shows
  how much it matters (and which Tu best matches the Princeton tunnel data).
reference: validation/naca0009_re1e5_princeton.csv
defaults:
  foil: naca0009
  chord: 0.08
  Re: 1.0e5
  turbulence: kOmegaSSTLM
  mesh: coarse
sweep:
  Tu: [0.05, 0.1, 0.3, 0.5, 1.0]
  aoa: [4, 8]
