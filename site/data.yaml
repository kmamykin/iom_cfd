# Data behind the website's study pages (site/<study>/index.qmd). Each entry is one file: a table
# in site/data/<name>.csv, or a picture or video in site/assets/<name>.<ext>.
#
#   uv run iomcfd site export [NAME ...]
#
# copies it out of the local runs (a light `gcp fetch` is enough for tables)
# and records the study, run, date and git version in site/data/sources.json.
# To update a figure with a newer run, change `runs` and export again.
#
# kind: table (default)  `file` of each run, concatenated; rows matching `where`; `columns`
#       force_history    foil2d force coefficients of `cases`, joined across continuations
#       file             one file copied as is (ParaView renders: they can't be rebuilt online)
#       manual           a table written by hand; `source` says where its numbers come from

validation-naca0009:
  study: validation-naca0009-re1e5
  runs: [20261011-212549]
  file: results.csv
  columns: [turbulence, aoa, Cl, Cd, status, unsteady]

steady-1ms:
  study: fin-profile-selection
  runs: [20261013-045759, 20261013-200643]   # run 3: 0008/80, 0008/90, 0009/80, 0009/100; run 4: 0007/90, 0007/100, 0008/100
  file: results.csv
  where: {speed: 1.0, Tu: 0.1}
  columns: [foil, chord, aoa, speed, rhoInf, Cl, Cd, Cl_std, Cd_std, Cd_friction, Cd_pressure, unsteady, status]

transient-4deg-1ms:
  study: transient-check
  runs: [20261015-161112]   # 30 flow-throughs, averaged over 24-30
  file: results.csv
  columns: [foil, chord, aoa, speed, max_co, rhoInf, Cl, Cd, Cl_std, Cd_friction, Cd_pressure, status]

transient-run3:
  study: transient-check
  runs: [20261017-000816]   # top four: 2 and 6 deg at 1 m/s, 4 deg at 0.75 and 1.5 m/s; averaged over 12-20
  file: results.csv
  columns: [foil, chord, aoa, speed, rhoInf, Cl, Cd, Cl_std, Cd_friction, Cd_pressure, status]

surface-0007-100-4deg:
  study: transient-check
  runs: [20261017-000816]   # final instant, not a time average; 1.5 m/s started from the steady solution
  file:
    - aoa4_chord0.1_foilnaca0007_speed0.75/surface.csv
    - aoa4_chord0.1_foilnaca0007_speed1.5/surface.csv
  digits: 5

surface-0007-100-4deg-rest:
  study: transient-check
  runs: [20261018-231921]   # 0007/100, 4 deg, 1.5 m/s started from rest, max_co 5; final instant
  file: aoa4_chord0.1_foilnaca0007_speed1.5/surface.csv
  digits: 5

force-history-4deg:
  kind: force_history
  study: transient-check
  runs: [20261015-161112]
  cases:
    - chord0.1_foilnaca0007_max_co10   # from rest, continued at 15 flow-throughs
    - chord0.1_foilnaca0009_max_co10   # from the steady solution
  every: 3   # of about 150 time steps per flow-through
  digits: 5

race-time-1ms:
  kind: manual
  source: >-
    projects/foil2d/findings/transient-check.md, run 20261017-000816, conclusion 5.
    Race-time loss, % behind the best, at 1 m/s and Tu 0.1 %, time-accurate 2, 4 and
    6 deg points (0008/90 at 6 deg steady); loss_x1 with the estimated resistance
    slope, loss_x2 with it doubled. Computed by an analysis script that is not yet in
    the repository (methodology.md).

race-time-by-speed:
  kind: manual
  source: >-
    projects/foil2d/findings/transient-check.md, run 20261018-231921, conclusion 4
    (0007/100 at 1.5 m/s: its 4 deg point started from rest, run 20261017-193613,
    max_co 10), and run 20261017-000816, conclusion 6 (the rest). Top four, race-time
    loss, % behind the best of the four, mean over the light, working and high loads,
    at 0.75, 1 and 1.5 m/s with time-accurate 4 deg points; loss_x1 / loss_x2 as above.

