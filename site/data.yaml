# --- Keel bulb page (site/bulb-design/index.qmd) -------------------------------------------------
# Track B, bulb2d: the bulb alone, axisymmetric, transition model
bulb-dress:   # validation: Dress's laminar body (measured data: projects/bulb2d/validation/dress1988.csv)
  study: validation-dress
  runs: [20261019-020534]
  file: results.csv
  columns: [turbulence, Tu, mesh, Re_L, Cd_wet, friction_share, x_sep, x_reattach, status]
bulb-fineness:   # 2380 g of lead as NACA bodies of L/D 5-14.3 at 0.5, 1 and 1.5 m/s
  study: fineness
  runs: [20261019-020546]
  file: results.csv
  columns: [fineness, speed, turbulence, Tu, length_m, diameter_m, wetted_area_m2, Re_L, drag_N, drag_friction_N,
            drag_pressure_N, x_sep, x_reattach, x_cf_min, status]
bulb-surface:   # skin friction and pressure along a fat (L/D 5.7) and a market-like (9.09) bulb, 1 m/s, Tu 0.1 %
  study: fineness
  runs: [20261019-020546]
  file:
    - Tu0.1_fineness5.7_speed1_turbulencekomegasstlm/surface.csv
    - Tu0.1_fineness9.09_speed1_turbulencekomegasstlm/surface.csv
  digits: 5
# Track A, keel3d: hull, fin and bulb, fully turbulent
bulb-endplate:   # the fin with and without the NACA 0011 bulb
  study: bulb-endplate
  runs: [20261019-020506]
  file: results.csv
  columns: [bulb, leeway, mesh, side_N, side_keel_N, side_fin_N, drag_N, drag_keel_N, drag_bulb_N, status]
bulb-section:   # six cross-sections of the NACA 0011 bulb, heel 0 and 25 deg, leeway 0-4 deg
  study: bulb-section
  runs: [20261019-203823]
  file: results.csv
  columns: [bulb_aspect, bulb_top, bulb_bottom, heel, leeway, mesh, speed, dynamicPressure, draft, side_N, drag_N,
            drag_hull_N, drag_fin_N, drag_fin_friction_N, drag_bulb_N, drag_bulb_friction_N, side_fin_N, side_bulb_N,
            vertical_bulb_N, pitch_bulb_Nm, bulb_width, bulb_height, bulb_cg_above_draft, bulb_wetted_area_m2, fin_span,
            status]
bulb-cant:   # the round bulb and the flat bottom at 0, 2 and 4 deg nose up
  study: bulb-cant
  runs: [20261020-183634]
  file: results.csv
  columns: [bulb_aspect, bulb_top, bulb_bottom, bulb_cant, heel, leeway, mesh, speed, dynamicPressure, draft, side_N,
            drag_N, drag_bulb_N, side_bulb_N, vertical_bulb_N, pitch_bulb_Nm, bulb_cg_above_draft, status]
bulb-spanload:   # the fin's side force along its span, with and without the bulb, 4 deg, upright, medium
