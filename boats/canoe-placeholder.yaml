# A stand-in IOM until the Alioth lines arrive: keel3d's canoe body (≈ Bantock:
# LWL 0.99 m, 3.62 L, 0.142 m²) with the recommended bulb (bulb-section and
# bulb-cant findings) on the market-like tapered fin, the A rig and the ORC
# 2026 sail coefficients. Every number marked PLACEHOLDER is a guess to be
# replaced with a measurement.
boat: canoe-placeholder
description: >
  keel3d canoe body, NACA 0007 fin 100 -> 80 mm (90 mm mean), NACA 0011 round
  bulb 2380 g at the 420 mm draft, A rig, ORC 2026 sails.

water: {temperature: 15.0}
air: {temperature: 15.0}

hull:
  geometry: canoe                 # canoe (CanoeSpec) | file:<path.stl> (stl_scale, stl_rotate, stl_translate)
  params: {}                      # CanoeSpec fields; empty = keel3d's defaults (hull_* in keel.params win)
  form_factor: 0.10               # (1 + k) - 1; methodology.md uses ITTC-57 x 1.10
  cf_factor: 1.0                  # < 1 brackets a laminar run (surface-roughness.md: up to -41 %)
  waves: michell                  # michell | none
  side_force: auto                # auto: off when the keel model already holds the hull's side force (keel3d)

keel:
  model: keel3d                   # keel3d (CFD fits) | foil (lifting line, rung 0)
  # keel3d-style parameters (projects/keel3d/defaults.yaml): geometry and mass of fin and bulb
  params: {fin_section: naca0007, fin_mean_chord: 0.09, fin_taper: 0.8, bulb_section: naca0011}
  # CFD fits: a keel3d run (<study>@<run id>, looked up in $IOMCFD_SOURCE_RUNS
  # then runs/; or a path to its results.csv) and the design to take from it
  results: bulb-section@20261019-203823
  select: {fin_taper: 0.8, bulb_section: naca0011, bulb_aspect: 1.0, bulb_top: 2.0, bulb_bottom: 2.0, mesh: medium}
  max_leeway: 4.0
  friction_factor: {fin: 1.0, bulb: 1.0}   # bulb-section's transition correction would be {fin: 0.80, bulb: 0.52}
  # Another fin section on the keel3d keel: 2D foil2d polars (100 mm chord, custom-section study)
  # applied as the change in profile drag and angle at equal fin lift (components/section.py).
  # foil = reference: no change. E.g. --set keel.section.foil=file:ht35-t0725.dat
  section:
    foil: naca0007
    reference: naca0007           # the keel3d run's fin section
    tu: 0.1                       # % : which polars
    polars:
      "0.1":                      # steady screen, time-accurate 2-5 deg replacing it (as custom-section.md)
        base: [site/data/custom-steady.csv]
        replace: [site/data/custom-transient.csv, site/data/custom-transient-15.csv,
                  site/data/custom-transient-rerun.csv, site/data/custom-0007-rest.csv]
      "1": {base: [site/data/custom-tu.csv]}   # steady
      "2": {base: [site/data/custom-tu.csv]}   # steady
  e: 0.9                          # foil model only

rudder:                           # appendage3d defaults
  section: naca0008
  root_chord: 0.085
  tip_chord: 0.060
  span: 0.20
  x: 0.86                         # root leading edge, m aft of the bow
  e: 0.9
  downwash: 1.0                   # fraction of the keel's elliptic far-field downwash ε = 2 C_L / (π A)

rig:
  rig: iom_a
  sails: orc2026                  # ORC VPP Documentation 2026 coefficients (full scale; not to be published)
  level: low                      # ORC coefficient set
  mast_x: 0.40
  deck: 0.06

windage:                          # topsides after ORC Table 5.12 (C_D 0.816 on freeboard x beam / x length)
  freeboard: 0.06                 # m, mean (default: the canoe body's)
  x: 0.5

mass:                             # PLACEHOLDER component masses and centres (boat frame, m)
  items:
    - {name: hull and deck, m: 0.40, cg: [0.48, 0.0, 0.01]}
    - {name: "rig A: mast, booms, sails, rigging", m: 0.22, cg: [0.42, 0.0, 0.55]}
    - {name: sail winch, m: 0.12, cg: [0.40, 0.0, -0.02]}
    - {name: "rudder servo, receiver, battery", m: 0.20, cg: [0.60, 0.0, -0.01]}
    - {name: rudder blade, m: 0.02, cg: [0.87, 0.0, -0.12]}
    - {name: fittings and fin box, m: 0.06, cg: [0.50, 0.0, 0.0]}
  fill_to: 4.0                    # corrector weight up to the class minimum (C.4.2)
  corrector_at: [0.50, 0.0, -0.03]

hydrostatics:
  attitude: solved                # solved (sinkage and trim under the sails' pitch moment) | static
  heel_max: 60.0
  heel_step: 2.5

wind:                             # PLACEHOLDER range and profile
  tws: [1.5, 2.0, 2.5, 3.0, 3.5, 4.0, 4.5, 5.0]
  weights: uniform                # uniform | [w, ...] | file:<club histogram.csv> (columns tws, weight)
  z_ref: 1.0                      # m, height the wind speed is measured at
  alpha: 0.12                     # power-law profile exponent

course:                           # PLACEHOLDER race settings
  leg: 100.0
  laps: 2
  tacks_per_leg: 4
  gybes_per_leg: 2
  tack_s: 3.0
  gybe_s: 2.0

solver:
  yaw: true
  flat_min: 0.53                  # ORC FLAT_MIN (§5.1.3)
  heel_max: 70.0
  jib_downwind: true              # also try ORC's jib downwind set (goose-winged jib) from β_TW 60°

polar:
  twa: [30, 35, 40, 45, 50, 60, 75, 90, 105, 120, 135, 150, 165, 180]
