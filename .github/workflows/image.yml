# Solver image for Cloud Batch: on every push to a branch, run the fast
# tests, then build docker/Dockerfile for linux/amd64 (what Batch VMs run) and
# push it to Artifact Registry as :<git describe>, the tag `make push` uses.
# Only main also moves :latest (config.env's default IMAGE_TAG); run a
# branch's image with `iomcfd gcp submit --tag <git describe>`.
#
# GCP access is keyless (Workload Identity Federation, limited to pushes to
# branches of this repository, not pull_request events); one-time setup:
# cloud/gcp/setup-github.sh, which also sets the repository variables used
# below. Local builds (`make image`) are not affected.
name: solver image

on:
  push:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: solver-image-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run pytest -m "not docker" -q

  image:
    needs: test
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      id-token: write  # OIDC token for Workload Identity Federation
    env:
      GCP_PROJECT: ${{ vars.GCP_PROJECT }}
      GCP_REGION: ${{ vars.GCP_REGION || 'us-central1' }}
      AR_REPO: ${{ vars.AR_REPO || 'iom-cfd' }}
      IMAGE_NAME: ${{ vars.IMAGE_NAME || 'iom-cfd' }}
      WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
      CI_SA: ${{ vars.GCP_CI_SA }}
    steps:
      - name: Check configuration
        run: |
          for v in GCP_PROJECT WIF_PROVIDER CI_SA; do
            if [ -z "${!v}" ]; then
              echo "::error::repository variable for $v is not set: run cloud/gcp/setup-github.sh"
              exit 1
            fi
          done

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # history and tags, so the tag equals `git describe` locally

      - name: Image name and tag
        id: meta
        run: |
          image="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT/$AR_REPO/$IMAGE_NAME"
          tag=$(git describe --always)
          {
            echo "tags<<EOF"
            echo "$image:$tag"
            if [ "$GITHUB_REF" = refs/heads/main ]; then echo "$image:latest"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.CI_SA }}
          token_format: access_token

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.GCP_REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          echo "Pushed: $(echo $TAGS)" >> "$GITHUB_STEP_SUMMARY"
