# Solver image for Cloud Batch: on every push to main (except website-only
# ones), run the fast tests, then build docker/Dockerfile for linux/amd64
# (what Batch VMs run) and push it to Artifact Registry as :<git describe>
# and :latest, the same tags `make push` uses.
#
# GCP access is keyless (Workload Identity Federation, limited to pushes to
# main of this repository); one-time setup: cloud/gcp/setup-github.sh, which
# also sets the repository variables used below. Local builds (`make image`)
# are not affected.
name: solver image

on:
  push:
    branches: [main]
    paths-ignore:  # the website alone doesn't change the image
      - "site/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

concurrency:
  group: solver-image
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run pytest -m "not docker" -q

  image:
    needs: test
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      id-token: write  # OIDC token for Workload Identity Federation
    env:
      GCP_PROJECT: ${{ vars.GCP_PROJECT }}
      GCP_REGION: ${{ vars.GCP_REGION || 'us-central1' }}
      AR_REPO: ${{ vars.AR_REPO || 'iom-cfd' }}
      IMAGE_NAME: ${{ vars.IMAGE_NAME || 'iom-cfd' }}
      WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
      CI_SA: ${{ vars.GCP_CI_SA }}
    steps:
      - name: Check configuration
        run: |
          for v in GCP_PROJECT WIF_PROVIDER CI_SA; do
            if [ -z "${!v}" ]; then
              echo "::error::repository variable for $v is not set: run cloud/gcp/setup-github.sh"
              exit 1
            fi
          done

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # history and tags, so the tag equals `git describe` locally

      - name: Image name and tag
        id: meta
        run: |
          echo "image=$GCP_REGION-docker.pkg.dev/$GCP_PROJECT/$AR_REPO/$IMAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "tag=$(git describe --always)" >> "$GITHUB_OUTPUT"

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.CI_SA }}
          token_format: access_token

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.GCP_REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "Pushed \`${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}\` (also \`:latest\`)" >> "$GITHUB_STEP_SUMMARY"
